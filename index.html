<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evoque Route Preview</title>
  <script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
:root{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#202124;
  --muted:#5f6368;
  --border:#dadce0;
  --focus:#1a73e8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:1000px;
  margin:0 auto;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-bottom:16px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:600;
}

input{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  font-size:15px;
  color:var(--text);
  transition:.2s;
}

input:focus{
  outline:none;
  border-color:var(--focus);
  box-shadow:0 0 0 3px rgba(26,115,232,.15);
}

#map{
  width:100%;
  height:430px;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  background:#fff;
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:18px;
}

.summary div{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
}

.summary span{
  display:block;
  color:var(--muted);
  font-size:13px;
}

.summary strong{
  display:block;
  margin-top:6px;
  font-size:22px;
  font-weight:700;
}

.status{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
}

.status.error{
  color:#d93025;
}

.hidden{
  display:none;
}

@media (max-width:700px){

.grid{
    grid-template-columns:1fr;
}

#map{
    height:320px;
}

.summary{
    grid-template-columns:1fr;
}

}
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div>
        <label for="pickup">Pickup location</label>
        <input id="pickup" type="text" autocomplete="off" placeholder="Enter pickup address or landmark" />
      </div>
      <div>
        <label for="dropoff">Drop-off location</label>
        <input id="dropoff" type="text" autocomplete="off" placeholder="Enter drop-off address or landmark" />
      </div>
    </div>

    <div id="map" aria-label="Route map"></div>

    <div id="summary" class="summary hidden" aria-live="polite">
      <div><span>Distance</span><strong id="distance">—</strong></div>
      <div><span>Estimated drive time</span><strong id="duration">—</strong></div>
    </div>
    <div id="status" class="status" aria-live="polite">Enter both locations to preview the route.</div>
  </div>

  <script>
    let map;
    let directionsService;
    let directionsRenderer;
    let pickupAutocomplete;
    let dropoffAutocomplete;
    let latestResult = null;

    const pickupInput = document.getElementById('pickup');
    const dropoffInput = document.getElementById('dropoff');
    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const distanceEl = document.getElementById('distance');
    const durationEl = document.getElementById('duration');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function initializeMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 34.0522, lng: -118.2437 },
        zoom: 10,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map,
        suppressMarkers: false,
        preserveViewport: false
      });

      pickupAutocomplete = new google.maps.places.Autocomplete(pickupInput, {
        fields: ['formatted_address', 'geometry', 'name', 'place_id'],
        componentRestrictions: { country: 'us' }
      });
      dropoffAutocomplete = new google.maps.places.Autocomplete(dropoffInput, {
        fields: ['formatted_address', 'geometry', 'name', 'place_id'],
        componentRestrictions: { country: 'us' }
      });

      pickupAutocomplete.addListener('place_changed', calculateRoute);
      dropoffAutocomplete.addListener('place_changed', calculateRoute);
      pickupInput.addEventListener('change', calculateRoute);
      dropoffInput.addEventListener('change', calculateRoute);

      if (window.JFCustomWidget) {
        JFCustomWidget.subscribe('ready', function(data) {
          if (data && data.value) {
            try {
              const saved = JSON.parse(data.value);
              pickupInput.value = saved.pickup || '';
              dropoffInput.value = saved.dropoff || '';
              setTimeout(calculateRoute, 400);
            } catch (e) {
              // Ignore malformed saved data.
            }
          }
          JFCustomWidget.requestFrameResize({ height: 455 });
        });

        JFCustomWidget.subscribe('submit', function() {
          const value = JSON.stringify(latestResult || {
            pickup: pickupInput.value.trim(),
            dropoff: dropoffInput.value.trim(),
            distance: '',
            duration: ''
          });
          JFCustomWidget.sendSubmit({
            valid: Boolean(pickupInput.value.trim() && dropoffInput.value.trim()),
            value
          });
        });
      }
    }

    function calculateRoute() {
      const origin = pickupInput.value.trim();
      const destination = dropoffInput.value.trim();

      if (!origin || !destination || !directionsService) {
        summaryEl.classList.add('hidden');
        setStatus('Enter both locations to preview the route.');
        return;
      }

      setStatus('Calculating route…');

      directionsService.route({
        origin,
        destination,
        travelMode: google.maps.TravelMode.DRIVING,
        provideRouteAlternatives: false
      }, function(result, status) {
        if (status !== 'OK' || !result.routes.length) {
          latestResult = null;
          summaryEl.classList.add('hidden');
          setStatus('We could not calculate that route. Please choose an address from the suggestions.', true);
          return;
        }

        directionsRenderer.setDirections(result);
        const leg = result.routes[0].legs[0];
        const pickup = leg.start_address || origin;
        const dropoff = leg.end_address || destination;
        const distance = leg.distance ? leg.distance.text : '';
        const duration = leg.duration ? leg.duration.text : '';

        pickupInput.value = pickup;
        dropoffInput.value = dropoff;
        distanceEl.textContent = distance || '—';
        durationEl.textContent = duration || '—';
        summaryEl.classList.remove('hidden');
        setStatus('Route preview ready.');

        latestResult = { pickup, dropoff, distance, duration };
        if (window.JFCustomWidget) {
          JFCustomWidget.sendData({ value: JSON.stringify(latestResult) });
        }
      });
    }

    window.initializeMap = initializeMap;
  </script>

  <!-- Replace YOUR_GOOGLE_MAPS_API_KEY before publishing. -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCDYzOzfdMdN25Ad_yxyypQTnNjdTf5aYY&libraries=places&callback=initializeMap"></script>
</body>
</html>
